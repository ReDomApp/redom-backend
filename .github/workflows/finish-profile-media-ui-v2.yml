name: Finish profile media UI v2
on:
  push:
    branches:
      - main
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch profile media UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('artifacts/redom-frontend/src/screens/ProfileScreen.tsx')
          s=p.read_text()
          start=s.index('function ProfileMediaSheet')
          end=s.index('function ProfileManagementSheet', start)
          replacement='''function ProfileMediaSheet({kind,onClose,onView,onChoose,ui}:{kind:"avatar"|"cover";onClose:()=>void;onView:()=>void;onChoose:()=>void;ui:ReturnType<typeof makeStyles>}){\n  const avatar=kind==="avatar";\n  return <Modal visible transparent animationType="slide" onRequestClose={onClose}><View style={ui.sheetBackdrop}><Pressable style={StyleSheet.absoluteFill} onPress={onClose}/><View style={ui.sheet}><View style={ui.sheetHandle}/><View style={ui.sheetHeader}><Text style={ui.sheetTitle}>{avatar?"Profile picture":"Cover photo"}</Text><Pressable onPress={onClose}><Text style={ui.modalClose}>×</Text></Pressable></View>{avatar?<><MediaRow Icon={RestylePictureIcon} label="Restyle profile picture with AI" onPress={()=>Alert.alert("Service Unavailable right now","Restyle profile picture with AI is unavailable right now.")} ui={ui}/><MediaRow Icon={ViewPictureIcon} label="See profile picture" onPress={onView} ui={ui}/><MediaRow Icon={ChoosePictureIcon} label="Choose profile picture" onPress={onChoose} ui={ui}/><MediaRow Icon={ImportInstagramIcon} label="Import from Instagram" onPress={()=>Alert.alert("Import from Instagram","Import from Instagram is unavailable right now.")} ui={ui}/></>:<><MediaRow Icon={CoverMediaIcon} label="See cover photo" onPress={onView} ui={ui}/><MediaRow Icon={UploadMediaIcon} label="Upload photo" onPress={onChoose} ui={ui}/><MediaRow Icon={CoverMediaIcon} label="Choose cover photo" onPress={()=>Alert.alert("Unavailable","Choose cover photo is not supported on ReDom right now.")} ui={ui}/></>}</View></View></Modal>;\n}\n\n'''
          p.write_text(s[:start]+replacement+s[end:])
          print('patched')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/redom-frontend/src/screens/ProfileScreen.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Complete profile media action sheets"
          git push

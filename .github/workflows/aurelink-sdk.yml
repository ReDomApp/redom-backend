name: Aurelink SDK tests

on:
  push:
    paths:
      - "sdk/aurelink-node/**"
      - "sdk/aurelink-java/**"
      - ".github/workflows/aurelink-sdk.yml"
  pull_request:
    paths:
      - "sdk/aurelink-node/**"
      - ".github/workflows/aurelink-sdk.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test sdk/aurelink-node/test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: stCarolas/setup-maven@v5
      - run: mvn -B -f sdk/aurelink-java/pom.xml -DskipTests package

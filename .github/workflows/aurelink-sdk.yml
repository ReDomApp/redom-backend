name: Aurelink SDK checks

on:
  push:
    branches:
      - rebuild/aurelink-typescript-react
    paths:
      - "artifacts/aurelink-new/sdk/**"
      - ".github/workflows/aurelink-sdk.yml"
  pull_request:
    paths:
      - "artifacts/aurelink-new/sdk/**"
      - ".github/workflows/aurelink-sdk.yml"
  workflow_dispatch:

jobs:
  node-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Node SDK tests
        working-directory: artifacts/aurelink-new/sdk/aurelink-node
        run: npm test
      - name: Validate package archive
        working-directory: artifacts/aurelink-new/sdk/aurelink-node
        run: npm pack --dry-run
  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python SDK tests
        working-directory: artifacts/aurelink-new/sdk/aurelink-python
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Validate Python package
        working-directory: artifacts/aurelink-new/sdk/aurelink-python
        run: python -m pip install --upgrade build && python -m build --wheel --sdist

name: Aurelink unified workspace checks

on:
  pull_request:
    branches:
      - main
      - rebuild/aurelink-typescript-react
      - feat/aurelink-communications-platform
    paths:
      - "artifacts/aurelink-public/src/**"
      - "artifacts/aurelink-public/index.html"
      - "artifacts/aurelink-public/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/aurelink-unified-workspace.yml"
  push:
    branches:
      - feat/aurelink-unified-customer-workspace
      - feat/aurelink-unified-workspace-pr64
    paths:
      - "artifacts/aurelink-public/src/**"
      - "artifacts/aurelink-public/index.html"
      - ".github/workflows/aurelink-unified-workspace.yml"

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck Aurelink public app
        run: pnpm --filter @workspace/aurelink-public typecheck
      - name: Build Aurelink public app
        run: pnpm --filter @workspace/aurelink-public build

name: Embed profile caption
on:
  push:
    branches:
      - main
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch caption embedding
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('artifacts/redom-backend/src/routes/profile-media.routes.ts')
          s=p.read_text()
          old='''function parseDataUri(value: string) {\n  const match = /^data:(image\\/(?:jpeg|jpg|png|webp));base64,([A-Za-z0-9+/=]+)$/.exec(value);\n  if (!match) throw new Error("Only JPEG, PNG, or WebP images are supported.");\n  const mime = match[1] === "image/jpg" ? "image/jpeg" : match[1];\n  const body = Buffer.from(match[2], "base64");\n  if (!body.length || body.length > 8 * 1024 * 1024) throw new Error("Profile media must be 8 MB or smaller.");\n  return { mime, body };\n}'''
          new='''function parseDataUri(value: string) {\n  const raster = /^data:(image\\/(?:jpeg|jpg|png|webp));base64,([A-Za-z0-9+/=]+)$/.exec(value);\n  if (raster) { const mime = raster[1] === "image/jpg" ? "image/jpeg" : raster[1]; const body = Buffer.from(raster[2], "base64"); if (!body.length || body.length > 8 * 1024 * 1024) throw new Error("Profile media must be 8 MB or smaller."); return { mime, body }; }\n  const svg = /^data:image\\/svg\\+xml(?:;charset=utf-8)?,(.+)$/s.exec(value);\n  if (svg) { const body = Buffer.from(decodeURIComponent(svg[1]), "utf8"); if (!body.length || body.length > 8 * 1024 * 1024) throw new Error("Profile media must be 8 MB or smaller."); if (/<script|<foreignObject|javascript:/i.test(body.toString("utf8"))) throw new Error("Invalid profile media."); return { mime: "image/svg+xml", body }; }\n  throw new Error("Only JPEG, PNG, WebP, or ReDom captioned SVG images are supported.");\n}'''
          if old not in s: raise SystemExit('backend parseDataUri pattern not found')
          p.write_text(s.replace(old,new))

          q=Path('artifacts/redom-frontend/src/screens/ProfilePicturePreviewScreen.tsx')
          t=q.read_text()
          old='''  const save=async()=>{if(wordCount>20){Alert.alert("Caption too long","Use no more than 20 words.");return;}if(!route.params.base64){Alert.alert("Profile picture","The selected image could not be prepared.");return;}setSaving(true);setProgress(1);try{await api.post("/profile/media/upload",{kind:"profile",image:`data:image/jpeg;base64,${route.params.base64}`,caption:caption.trim(),temporary,shareToFeed:true});'''
          new='''  const save=async()=>{if(wordCount>20){Alert.alert("Caption too long","Use no more than 20 words.");return;}if(!route.params.base64){Alert.alert("Profile picture","The selected image could not be prepared.");return;}setSaving(true);setProgress(1);try{const safeCaption=caption.trim().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\\"/g,"&quot;");const lines=safeCaption?safeCaption.split(/\\s+/).reduce<string[]>((acc,word)=>{const last=acc[acc.length-1]||"";if((last+" "+word).trim().length>34)acc.push(word);else acc[acc.length-1]=(last+" "+word).trim();return acc;},[""]):[];const svg=safeCaption?`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><image href="data:image/jpeg;base64,${route.params.base64}" width="1080" height="1080" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="900" width="1080" height="180" fill="rgba(0,0,0,.55)"/>${lines.map((line,i)=>`<text x="540" y="${960+i*42}" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="600" fill="white">${line}</text>`).join("")}</svg>`:null;const image=svg?`data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`:`data:image/jpeg;base64,${route.params.base64}`;await api.post("/profile/media/upload",{kind:"profile",image,caption:caption.trim(),temporary,shareToFeed:true});'''
          if old not in t: raise SystemExit('frontend save pattern not found')
          q.write_text(t.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/redom-backend/src/routes/profile-media.routes.ts artifacts/redom-frontend/src/screens/ProfilePicturePreviewScreen.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Embed profile picture captions in uploaded media"
          git push

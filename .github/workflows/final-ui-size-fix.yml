name: Final profile UI size fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Apply exact profile UI sizes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply exact profile UI sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/redom-frontend/src/screens/EditProfileScreen.tsx')
          s=p.read_text()
          s=s.replace('import PencilIcon from "../assets/edit-profile/pencil.svg";','import PencilIcon from "../assets/edit-profile/pencil.svg";\nimport ChevronIcon from "../assets/edit-profile/chevron.svg";')
          s=s.replace('<Text style={styles.chevron}>{open ? "⌃" : "⌄"}</Text>','<ChevronIcon width={16} height={16} style={open ? undefined : { transform: [{ rotate: "180deg" }] }} />')
          s=s.replace('    chevron: { width: n(20), textAlign: "center", fontSize: n(25), lineHeight: n(22), fontWeight: "700", color: "#050505" },\n','')
          p.write_text(s)
          p=Path('artifacts/redom-frontend/src/screens/HomeFeedScreenV3.tsx')
          s=p.read_text()
          s=s.replace('storyCard: { width: s(108), height: s(192),','storyCard: { width: s(112), height: s(200),')
          s=s.replace('musicCard: { width: s(108), height: s(192),','musicCard: { width: s(112), height: s(200),')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/redom-frontend/src/screens/EditProfileScreen.tsx artifacts/redom-frontend/src/screens/HomeFeedScreenV3.tsx
          git commit -m "Apply exact profile UI sizes"
          git push

name: ReDom Mail Typecheck

on:
  pull_request:
    paths:
      - "artifacts/redom-mail/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - "artifacts/redom-mail/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck ReDom Mail
        run: pnpm --filter @workspace/redom-mail run typecheck
      - name: Build ReDom Mail
        run: pnpm --filter @workspace/redom-mail run build

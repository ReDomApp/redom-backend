name: Update profile privacy UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message != 'Apply profile privacy UI and smaller edit profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply profile privacy and responsive UI changes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('artifacts/redom-frontend/src/screens/EditProfileScreen.tsx')
          s = p.read_text()
          s = s.replace('import { useCallback, useEffect, useState } from "react";', 'import { useCallback, useEffect, useMemo, useState } from "react";')
          s = s.replace('import { Alert, Pressable, SafeAreaView, ScrollView, StyleSheet, Text, View } from "react-native";', 'import { Alert, Pressable, SafeAreaView, ScrollView, StyleSheet, Text, useWindowDimensions, View } from "react-native";')
          s = s.replace('import PencilIcon from "../assets/edit-profile/pencil.svg";', 'import PencilIcon from "../assets/edit-profile/pencil.svg";\nimport { privacyLabel, type Privacy } from "./edit-profile/EditProfileAudienceModal";')
          s = s.replace('  const [data, setData] = useState<EditData | null>(null);', '  const { width } = useWindowDimensions();\n  const scale = Math.min(1, Math.max(0.86, width / 412));\n  const styles = useMemo(() => makeStyles(scale), [scale]);\n  const [data, setData] = useState<EditData | null>(null);')
          s = s.replace('  const row = (icon: JSX.Element, title: string, value: string | undefined, action?: () => void, disabled = false) => (', '  const row = (icon: JSX.Element, title: string, value: string | undefined, action?: () => void, disabled = false, privacy?: string) => (')
          s = s.replace('        {value ? <Text style={styles.value} numberOfLines={1}>{value}</Text> : null}\n      </View>', '        {value ? <Text style={styles.value} numberOfLines={1}>{value}</Text> : null}\n        {value && privacy ? <Text style={styles.privacy} numberOfLines={1}>{privacyLabel(privacy as Privacy)}</Text> : null}\n      </View>')
          s = s.replace('row(<PinIcon width={38} height={38} />, "Pinned details", data.currentCity || data.hometown || undefined, unavailable)', 'row(<PinIcon width={38} height={38} />, "Pinned details", data.currentCity || data.hometown || undefined, unavailable, data.currentCity ? data.currentCityPrivacy : data.hometownPrivacy)')
          s = s.replace('row(<LocationIcon width={38} height={38} />, "Current city", data.currentCity || undefined, () => navigation.navigate("EditLocationSearch", { kind: "location" }))', 'row(<LocationIcon width={38} height={38} />, "Current city", data.currentCity || undefined, () => navigation.navigate("EditLocationSearch", { kind: "location" }), false, data.currentCityPrivacy)')
          s = s.replace('row(<HometownIcon width={38} height={38} />, "Hometown", data.hometown || undefined, () => navigation.navigate("EditLocationSearch", { kind: "hometown" }))', 'row(<HometownIcon width={38} height={38} />, "Hometown", data.hometown || undefined, () => navigation.navigate("EditLocationSearch", { kind: "hometown" }), false, data.hometownPrivacy)')
          s = s.replace('row(<BirthdayIcon width={38} height={38} />, birthday || "Birthday", undefined, () => navigation.navigate("EditBirthday"))', 'row(<BirthdayIcon width={38} height={38} />, birthday || "Birthday", undefined, () => navigation.navigate("EditBirthday"), false, `${privacyLabel(data.birthdayMonthDayPrivacy as Privacy)} / ${privacyLabel(data.birthdayYearPrivacy as Privacy)}`)')
          s = s.replace('const styles = StyleSheet.create({', 'function makeStyles(scale: number) {\n  const n = (value: number) => Math.round(value * scale);\n  return StyleSheet.create({')
          s = s.replace('  loading: { padding: 24, color: "#65676B", fontSize: 16 },\n});', '  privacy: { marginTop: 2, color: "#65676B", fontSize: n(13), lineHeight: n(17) },\n  loading: { padding: n(20), color: "#65676B", fontSize: n(16) },\n  });\n}')
          replacements = {\
            'paddingHorizontal: 22': 'paddingHorizontal: n(16)',\
            'height: 64': 'height: n(56)',\
            'fontSize: 27': 'fontSize: n(23)',\
            'lineHeight: 32': 'lineHeight: n(28)',\
            'width: 34': 'width: n(28)',\
            'minHeight: 72': 'minHeight: n(58)',\
            'paddingHorizontal: 24': 'paddingHorizontal: n(16)',\
            'paddingTop: 18': 'paddingTop: n(10)',\
            'paddingBottom: 10': 'paddingBottom: n(6)',\
            'fontSize: 25': 'fontSize: n(22)',\
            'lineHeight: 31': 'lineHeight: n(27)',\
            'fontSize: 32': 'fontSize: n(27)',\
            'lineHeight: 32': 'lineHeight: n(27)',\
            'minHeight: 86': 'minHeight: n(68)',\
            'width: 58': 'width: n(46)',\
            'paddingRight: 12': 'paddingRight: n(8)',\
            'fontSize: 21': 'fontSize: n(18)',\
            'lineHeight: 26': 'lineHeight: n(23)',\
            'fontSize: 18': 'fontSize: n(15)',\
            'lineHeight: 23': 'lineHeight: n(19)',\
            'width: 28': 'width: n(23)',\
            'height: 28': 'height: n(23)',\
          }\
          for a,b in replacements.items(): s = s.replace(a,b)
          p.write_text(s)

          p = Path('artifacts/redom-backend/src/routes/profile.routes.ts')
          s = p.read_text()
          s = s.replace('         p.current_city,\n         p.profile_visibility,', '         p.current_city,\n         p.hometown,\n         p.bio,\n         p.bio_privacy,\n         p.current_city_privacy,\n         p.hometown_privacy,\n         p.birthday_month_day_privacy,\n         p.birthday_year_privacy,\n         p.profile_visibility,')
          s = s.replace('    const owner =\n      profile.id === viewerId ||\n      profile.profile_id === viewerProfileId;\n', '''    const owner =\n      profile.id === viewerId ||\n      profile.profile_id === viewerProfileId;\n\n    const relationship = owner ? { friend: true, friendsOfFriends: true } : (await pool.query(\n      `SELECT\n         EXISTS (SELECT 1 FROM friends f WHERE ((f.user_id=$1 AND f.friend_user_id=$2) OR (f.user_id=$2 AND f.friend_user_id=$1)) AND f.friendship_status='active') AS friend,\n         EXISTS (\n           SELECT 1 FROM friends f1\n           JOIN friends f2 ON f2.user_id = f1.friend_user_id\n           WHERE f1.user_id=$1 AND f1.friendship_status='active'\n             AND f2.friend_user_id=$2 AND f2.friendship_status='active'\n         ) AS friends_of_friends`,\n      [viewerId, profile.id],\n    )).rows[0] || { friend: false, friends_ofFriends: false };\n\n    const canSee = (privacy: string | null | undefined) => {\n      if (owner || privacy === 'public') return true;\n      if (privacy === 'friends') return !!relationship.friend;\n      if (privacy === 'friends_of_friends') return !!relationship.friends_of_friends;\n      return false;\n    };\n''')
          s = s.replace('          location: null,\n          birthday: null,', '          location: null,\n          hometown: null,\n          bio: null,\n          birthday: null,')
          s = s.replace('      location: profile.current_city || null,\n      birthday: formatDate(profile.date_of_birth),', '''      bio: canSee(profile.bio_privacy) ? (profile.bio || null) : null,\n      location: canSee(profile.current_city_privacy) ? (profile.current_city || null) : null,\n      hometown: canSee(profile.hometown_privacy) ? (profile.hometown || null) : null,\n      birthday: profile.date_of_birth ? (() => {\n        const d = new Date(profile.date_of_birth);\n        const monthDay = canSee(profile.birthday_month_day_privacy);\n        const year = canSee(profile.birthday_year_privacy);\n        if (monthDay && year) return formatDate(profile.date_of_birth);\n        if (monthDay) return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });\n        if (year) return d.toLocaleDateString('en-US', { year: 'numeric' });\n        return null;\n      })() : null,''')
          s = s.replace('          joinedCountry: profile.joined_country || "",', '          joinedCountry: profile.joined_country || "",')
          p.write_text(s)
          PY
          git config user.name 'ReDom'
          git config user.email 'jessicasanchez89965@gmail.com'
          git add artifacts/redom-frontend/src/screens/EditProfileScreen.tsx artifacts/redom-backend/src/routes/profile.routes.ts
          git commit -m 'Apply profile privacy UI and smaller edit profile'
          git push origin main
          rm -f .github/workflows/update-profile-privacy-ui.yml
          git add .github/workflows/update-profile-privacy-ui.yml
          git commit -m 'Remove temporary profile privacy update workflow'
          git push origin main

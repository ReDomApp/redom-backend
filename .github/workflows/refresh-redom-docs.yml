name: Refresh ReDom documentation catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redom-docs-catalog
  cancel-in-progress: true

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate repository catalog
        run: node scripts/docs/generate-catalog.mjs
      - name: Commit generated documentation index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/redom-docs/catalog.json
          if git diff --cached --quiet; then
            echo "Documentation catalog is already current."
            exit 0
          fi
          git commit -m "docs: refresh source catalog"
          git push

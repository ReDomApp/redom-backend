name: Aurelink SMTP Relay Validation

on:
  push:
    branches:
      - feat/aurelink-communications-platform
    paths:
      - "infra/aurelink-smtp/**"
      - ".github/workflows/aurelink-smtp.yml"
  pull_request:
    paths:
      - "infra/aurelink-smtp/**"
      - ".github/workflows/aurelink-smtp.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aurelink-smtp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check

name: Apply profile media UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Apply profile media UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply exact profile media interactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/redom-frontend/src/screens/ProfileScreen.tsx')
          s=p.read_text()
          s=s.replace('import { Alert, Image, ImageBackground, Modal, Pressable, RefreshControl, SafeAreaView, ScrollView, StyleSheet, Text, TextInput, useWindowDimensions, View } from "react-native";', 'import { Alert, Image, ImageBackground, Modal, Pressable, RefreshControl, SafeAreaView, ScrollView, StyleSheet, Text, TextInput, useWindowDimensions, View } from "react-native";\nimport * as ImagePicker from "expo-image-picker";')
          s=s.replace('import SessionIcon from "../assets/home-feed/session.svg";', 'import SessionIcon from "../assets/home-feed/session.svg";\nimport RestylePictureIcon from "../assets/profile-media/restyle.svg";\nimport ViewPictureIcon from "../assets/profile-media/view-picture.svg";\nimport ChoosePictureIcon from "../assets/profile-media/choose-picture.svg";\nimport ImportInstagramIcon from "../assets/profile-media/import-instagram.svg";\nimport UploadMediaIcon from "../assets/profile-media/upload.svg";\nimport CoverMediaIcon from "../assets/profile-media/cover.svg";\nimport InfoMediaIcon from "../assets/profile-media/info.svg";')
          marker='  const enterVisitorPreview = () => { setSheet(null); setVisitorPreview(true); };'
          insert='''  const enterVisitorPreview = () => { setSheet(null); setVisitorPreview(true); };\n\n  const pickProfileMedia = async (kind: "avatar" | "cover") => {\n    setSheet(null);\n    const permission = await ImagePicker.requestMediaLibraryPermissionsAsync();\n    if (!permission.granted) { Alert.alert("Photos permission", "Allow ReDom to access your photos to choose a profile picture."); return; }\n    const result = await ImagePicker.launchImageLibraryAsync({ mediaTypes: ["images"], allowsMultipleSelection: false, quality: 0.9, base64: true });\n    if (result.canceled || !result.assets?.[0]) return;\n    const asset = result.assets[0];\n    if (!asset.base64) { Alert.alert("Photo", "ReDom could not prepare that photo. Please choose another image."); return; }\n    const params = { uri: asset.uri, base64: asset.base64, width: asset.width || 1080, height: asset.height || 1080 };\n    navigation.navigate(kind === "avatar" ? "ProfilePictureAdjust" : "CoverPhotoAdjust", params);\n  };'''
          if marker not in s: raise SystemExit('profile handler marker missing')
          s=s.replace(marker,insert,1)
          s=s.replace('<Pressable accessibilityLabel="Edit cover photo"><CoverEditIcon width={ui.coverToolIcon} height={ui.coverToolIcon} /></Pressable>', '<Pressable accessibilityLabel="Edit cover photo" onPress={() => setSheet("cover")}><CoverEditIcon width={ui.coverToolIcon} height={ui.coverToolIcon} /></Pressable>',1)
          s=s.replace('<View style={ui.avatarPosition}><View style={ui.avatarRing}><Avatar uri={p?.profilePhoto || user?.profilePhoto} size={ui.profileAvatar} /></View>', '<View style={ui.avatarPosition}><Pressable style={ui.avatarRing} onPress={() => setSheet("avatar")} accessibilityLabel="Open profile picture options"><Avatar uri={p?.profilePhoto || user?.profilePhoto} size={ui.profileAvatar} /></Pressable>',1)
          old='<ProfileSheet kind={sheet} name={name} firstName={firstName} visitorPreview={visitorPreview} onClose={() => setSheet(null)} onCopy={copyProfileLink} onViewAsVisitor={owner ? enterVisitorPreview : undefined} ui={ui} />'
          new='<>{sheet === "avatar" || sheet === "cover" ? <ProfileMediaSheet kind={sheet} onClose={() => setSheet(null)} onView={() => navigation.navigate(sheet === "avatar" ? "ProfilePictureViewer" : "CoverPhotoViewer")} onChoose={() => void pickProfileMedia(sheet === "avatar" ? "avatar" : "cover")} ui={ui} /> : <ProfileSheet kind={sheet} name={name} firstName={firstName} visitorPreview={visitorPreview} onClose={() => setSheet(null)} onCopy={copyProfileLink} onViewAsVisitor={owner ? enterVisitorPreview : undefined} ui={ui} />}</>'
          if old not in s: raise SystemExit('sheet JSX marker missing')
          s=s.replace(old,new,1)
          insert_before='function ProfileSheet('
          component='''function ProfileMediaSheet({kind,onClose,onView,onChoose,ui}:{kind:"avatar"|"cover";onClose:()=>void;onView:()=>void;onChoose:()=>void;ui:ReturnType<typeof makeStyles>}) {\n  const [unavailable,setUnavailable]=useState(false);\n  const avatar=kind==="avatar";\n  return <Modal visible transparent animationType="slide" onRequestClose={onClose}><View style={ui.sheetBackdrop}><View style={ui.mediaSheet}><View style={ui.sheetHandle}/><View style={ui.sheetHeader}><Text style={ui.sheetTitle}>{avatar ? "Profile picture" : "Cover photo"}</Text><Pressable onPress={onClose}><Text style={ui.modalClose}>×</Text></Pressable></View>\n    {avatar ? <><MediaRow Icon={RestylePictureIcon} label="Restyle profile picture with AI" onPress={()=>setUnavailable(true)} ui={ui}/><MediaRow Icon={ViewPictureIcon} label="See profile picture" onPress={onView} ui={ui}/><MediaRow Icon={ChoosePictureIcon} label="Choose profile picture" onPress={onChoose} ui={ui}/><MediaRow Icon={ImportInstagramIcon} label="Import from Instagram" onPress={()=>setUnavailable(true)} ui={ui}/></> : <><MediaRow Icon={CoverMediaIcon} label="See cover photo" onPress={onView} ui={ui}/><MediaRow Icon={UploadMediaIcon} label="Upload photo" onPress={onChoose} ui={ui}/><MediaRow Icon={ChoosePictureIcon} label="Choose cover photo" onPress={()=>setUnavailable(true)} ui={ui}/></>}\n  </View></View></Modal>;\n}\nfunction MediaRow({Icon,label,onPress,ui}:{Icon:React.ComponentType<{width?:number;height?:number}>;label:string;onPress:()=>void;ui:ReturnType<typeof makeStyles>}) { return <Pressable style={ui.mediaRow} onPress={onPress}><View style={ui.mediaIconCircle}><Icon width={24} height={24}/></View><Text style={ui.mediaRowText}>{label}</Text></Pressable>; }\nfunction UnavailableMediaModal({visible,onClose,ui}:{visible:boolean;onClose:()=>void;ui:ReturnType<typeof makeStyles>}) { return <Modal visible={visible} transparent animationType="fade" onRequestClose={onClose}><View style={ui.infoBackdrop}><View style={ui.infoCard}><InfoMediaIcon width={42} height={42}/><Text style={ui.infoTitle}>Service Unavailable right now</Text><Text style={ui.infoText}>This feature is unavailable right now. Please try again later.</Text><Pressable style={ui.infoButton} onPress={onClose}><Text style={ui.infoButtonText}>OK</Text></Pressable></View></View></Modal>; }\n\n'''
          # Put unavailable modal into ProfileMediaSheet by replacing its closing fragment.
          component=component.replace('  </View></View></Modal>;\n}', '    <UnavailableMediaModal visible={unavailable} onClose={()=>setUnavailable(false)} ui={ui}/>\n  </View></View></Modal>;\n}',1)
          if insert_before not in s: raise SystemExit('ProfileSheet function marker missing')
          s=s.replace(insert_before,component+insert_before,1)
          # Add styles before the existing sheet row style marker.
          style_marker='    sheetRow: {'
          style_insert='''    mediaSheet: { backgroundColor:"#fff", borderTopLeftRadius:28, borderTopRightRadius:28, paddingHorizontal:n(22), paddingBottom:n(24) },\n    mediaRow: { minHeight:n(68), flexDirection:"row", alignItems:"center", gap:n(16) },\n    mediaIconCircle: { width:n(46), height:n(46), borderRadius:n(23), backgroundColor:"#E4E6EB", alignItems:"center", justifyContent:"center" },\n    mediaRowText: { flex:1, color:"#050505", fontSize:n(16), fontWeight:"600" },\n    infoBackdrop: { flex:1, backgroundColor:"rgba(0,0,0,.45)", alignItems:"center", justifyContent:"center", padding:n(28) },\n    infoCard: { width:"100%", maxWidth:n(330), backgroundColor:"#fff", borderRadius:n(18), padding:n(24), alignItems:"center" },\n    infoTitle: { marginTop:n(12), fontSize:n(18), fontWeight:"700", color:"#050505", textAlign:"center" },\n    infoText: { marginTop:n(8), fontSize:n(14), lineHeight:n(20), color:"#65676B", textAlign:"center" },\n    infoButton: { marginTop:n(18), minWidth:n(90), height:n(42), borderRadius:n(10), backgroundColor:"#1877F2", alignItems:"center", justifyContent:"center" },\n    infoButtonText: { color:"#fff", fontSize:n(15), fontWeight:"700" },\n'''
          if style_marker not in s: raise SystemExit('style marker missing')
          s=s.replace(style_marker,style_insert+style_marker,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/redom-frontend/src/screens/ProfileScreen.tsx
          git commit -m "Apply profile media UI"
          git push
          git rm .github/workflows/apply-profile-media-ui.yml
          git commit -m "Remove temporary profile media UI workflow"
          git push

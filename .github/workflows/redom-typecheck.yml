name: ReDom frontend and backend typecheck

on:
  push:
    branches: [main]
    paths:
      - "artifacts/redom-frontend/**"
      - "artifacts/redom-backend/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/redom-typecheck.yml"
  pull_request:
    paths:
      - "artifacts/redom-frontend/**"
      - "artifacts/redom-backend/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck ReDom frontend
        run: pnpm --filter @workspace/redom-frontend run typecheck
      - name: Typecheck ReDom backend
        run: pnpm --filter @workspace/redom-backend run typecheck

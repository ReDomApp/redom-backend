name: ReDom Backend Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/redom-backend/**"
      - "artifacts/redom-intelligence/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/redom-backend-check.yml"
  push:
    branches: [main, feat/daily-ops-intelligence, feat/redom-intelligence-core]
    paths:
      - "artifacts/redom-backend/**"
      - "artifacts/redom-intelligence/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/redom-backend run typecheck
      - run: pnpm --filter @workspace/redom-backend run build
      - name: Typecheck independent ReDom Intelligence Core
        run: pnpm --filter @redom/intelligence-core run typecheck
      - name: Test independent ReDom Intelligence Core
        run: pnpm --filter @redom/intelligence-core run test
      - name: Build independent ReDom Intelligence Core
        run: pnpm --filter @redom/intelligence-core run build

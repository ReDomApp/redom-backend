name: Update profile media lock
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  lock:
    if: github.event.head_commit.message != 'Update profile media dependency lock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Update lockfile
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Update profile media dependency lock" || true
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/update-profile-media-lock.yml || true
          git commit -m "Remove temporary profile media lock workflow" || true
          git push || true

name: Apply login security implementation

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/implement_login_security.py'
      - '.github/workflows/apply-login-security.yml'

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply implementation
        run: python3 .github/scripts/implement_login_security.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/redom-frontend/src/auth/validation.ts artifacts/redom-frontend/src/screens/LoginScreen.tsx artifacts/redom-backend/src/validators/auth.validator.ts artifacts/redom-backend/src/controllers/auth.controller.ts artifacts/redom-backend/src/services/auth/login-history.service.ts artifacts/redom-backend/src/services/auth/login-flow.service.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Implement phone login and trusted IP device verification'
          git push

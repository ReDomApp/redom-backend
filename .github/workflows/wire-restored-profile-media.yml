name: Wire restored profile media
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: github.event.head_commit.message != 'Wire profile media into restored profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire profile media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/redom-frontend/src/screens/ProfileScreen.tsx')
          s = p.read_text()

          # Imports required by the new media flow.
          marker = 'import * as Clipboard from "expo-clipboard";'
          if 'import * as ImagePicker from "expo-image-picker";' not in s:
              s = s.replace(marker, marker + '\nimport * as ImagePicker from "expo-image-picker";', 1)

          marker = 'import SessionIcon from "../assets/home-feed/session.svg";'
          media_imports = '''import RestylePictureIcon from "../assets/profile-media/restyle.svg";
          import ViewPictureIcon from "../assets/profile-media/view-picture.svg";
          import ChoosePictureIcon from "../assets/profile-media/choose-picture.svg";
          import ImportInstagramIcon from "../assets/profile-media/import-instagram.svg";
          import UploadMediaIcon from "../assets/profile-media/upload.svg";
          import CoverMediaIcon from "../assets/profile-media/cover.svg";
          import InfoMediaIcon from "../assets/profile-media/info.svg";'''
          if 'import RestylePictureIcon' not in s:
              s = s.replace(marker, marker + '\n' + media_imports, 1)

          # Real picker -> crop/adjust -> preview -> Neon/R2 upload.
          marker = '  const enterVisitorPreview = () => { setSheet(null); setVisitorPreview(true); };'
          handler = '''  const enterVisitorPreview = () => { setSheet(null); setVisitorPreview(true); };

            const pickProfileMedia = async (kind: "avatar" | "cover") => {
              setSheet(null);
              const permission = await ImagePicker.requestMediaLibraryPermissionsAsync();
              if (!permission.granted) {
                Alert.alert("Photos permission", "Allow ReDom to access your photos to choose a profile picture.");
                return;
              }
              const result = await ImagePicker.launchImageLibraryAsync({
                mediaTypes: ["images"],
                allowsMultipleSelection: false,
                quality: 0.9,
                base64: true,
              });
              if (result.canceled || !result.assets?.[0]) return;
              const asset = result.assets[0];
              if (!asset.base64) {
                Alert.alert("Photo", "ReDom could not prepare that photo. Please choose another image.");
                return;
              }
              const params = {
                uri: asset.uri,
                base64: asset.base64,
                width: asset.width || 1080,
                height: asset.height || 1080,
              };
              navigation.navigate(kind === "avatar" ? "ProfilePictureAdjust" : "CoverPhotoAdjust", params);
            };'''
          if marker not in s:
              raise SystemExit('profile handler marker missing')
          if 'const pickProfileMedia = async' not in s:
              s = s.replace(marker, handler, 1)

          # Wire both visible camera/edit controls to the media sheet.
          old = '<Pressable accessibilityLabel="Edit cover photo"><CoverEditIcon width={ui.coverToolIcon} height={ui.coverToolIcon} /></Pressable>'
          new = '<Pressable accessibilityLabel="Edit cover photo" onPress={() => setSheet("cover")}><CoverEditIcon width={ui.coverToolIcon} height={ui.coverToolIcon} /></Pressable>'
          if old in s:
              s = s.replace(old, new, 1)

          # Replace the old generic cover/avatar rows with the dedicated media sheet.
          old = '<ProfileSheet kind={sheet} name={name} firstName={firstName} visitorPreview={visitorPreview} onClose={() => setSheet(null)} onCopy={copyProfileLink} onViewAsVisitor={owner ? enterVisitorPreview : undefined} ui={ui} />'
          new = '''{sheet === "avatar" || sheet === "cover" ? <ProfileMediaSheet
            kind={sheet}
            onClose={() => setSheet(null)}
            onView={() => navigation.navigate(sheet === "avatar" ? "ProfilePictureViewer" : "CoverPhotoViewer")}
            onChoose={() => void pickProfileMedia(sheet === "avatar" ? "avatar" : "cover")}
            ui={ui}
          /> : <ProfileSheet kind={sheet} name={name} firstName={firstName} visitorPreview={visitorPreview} onClose={() => setSheet(null)} onCopy={copyProfileLink} onViewAsVisitor={owner ? enterVisitorPreview : undefined} ui={ui} />}'''
          if old not in s:
              raise SystemExit('ProfileSheet render marker missing')
          s = s.replace(old, new, 1)

          # Dedicated sheet and unavailable modal. Existing profile management remains untouched.
          marker = 'function ProfileSheet('
          component = '''function ProfileMediaSheet({kind,onClose,onView,onChoose,ui}:{kind:"avatar"|"cover";onClose:()=>void;onView:()=>void;onChoose:()=>void;ui:ReturnType<typeof makeStyles>}) {
            const [unavailable,setUnavailable]=useState(false);
            const avatar=kind==="avatar";
            return <Modal visible transparent animationType="slide" onRequestClose={onClose}>
              <View style={ui.sheetBackdrop}>
                <View style={ui.mediaSheet}>
                  <View style={ui.sheetHandle}/>
                  <View style={ui.sheetHeader}>
                    <Text style={ui.sheetTitle}>{avatar ? "Profile picture" : "Cover photo"}</Text>
                    <Pressable onPress={onClose}><Text style={ui.modalClose}>×</Text></Pressable>
                  </View>
                  {avatar ? <>
                    <MediaRow Icon={RestylePictureIcon} label="Restyle profile picture with AI" onPress={()=>setUnavailable(true)} ui={ui}/>
                    <MediaRow Icon={ViewPictureIcon} label="See profile picture" onPress={onView} ui={ui}/>
                    <MediaRow Icon={ChoosePictureIcon} label="Choose profile picture" onPress={onChoose} ui={ui}/>
                    <MediaRow Icon={ImportInstagramIcon} label="Import from Instagram" onPress={()=>setUnavailable(true)} ui={ui}/>
                  </> : <>
                    <MediaRow Icon={CoverMediaIcon} label="See cover photo" onPress={onView} ui={ui}/>
                    <MediaRow Icon={UploadMediaIcon} label="Upload photo" onPress={onChoose} ui={ui}/>
                    <MediaRow Icon={ChoosePictureIcon} label="Choose cover photo" onPress={()=>setUnavailable(true)} ui={ui}/>
                  </>}
                  <UnavailableMediaModal visible={unavailable} onClose={()=>setUnavailable(false)} ui={ui}/>
                </View>
              </View>
            </Modal>;
          }
          function MediaRow({Icon,label,onPress,ui}:{Icon:any;label:string;onPress:()=>void;ui:ReturnType<typeof makeStyles>}) {
            return <Pressable style={ui.mediaRow} onPress={onPress} accessibilityRole="button" accessibilityLabel={label}>
              <View style={ui.mediaIconCircle}><Icon width={ui.sheetIcon} height={ui.sheetIcon}/></View>
              <Text style={ui.mediaRowText}>{label}</Text>
            </Pressable>;
          }
          function UnavailableMediaModal({visible,onClose,ui}:{visible:boolean;onClose:()=>void;ui:ReturnType<typeof makeStyles>}) {
            return <Modal visible={visible} transparent animationType="fade" onRequestClose={onClose}>
              <View style={ui.infoBackdrop}>
                <View style={ui.infoCard}>
                  <InfoMediaIcon width={42} height={42}/>
                  <Text style={ui.infoTitle}>Service Unavailable right now</Text>
                  <Text style={ui.infoText}>This feature is unavailable right now. Please try again later.</Text>
                  <Pressable style={ui.infoButton} onPress={onClose}><Text style={ui.infoButtonText}>OK</Text></Pressable>
                </View>
              </View>
            </Modal>;
          }

          '''
          if 'function ProfileMediaSheet(' not in s:
              s = s.replace(marker, component + marker, 1)

          # Dedicated styles, kept inside the restored profile style system.
          marker = 'sheetRow:{minHeight:n(48)'
          styles = '''mediaSheet:{backgroundColor:"#fff",borderTopLeftRadius:n(20),borderTopRightRadius:n(20),paddingHorizontal:horizontal,paddingTop:n(8),paddingBottom:n(22),maxHeight:"88%"},mediaRow:{minHeight:n(58),flexDirection:"row",alignItems:"center",gap:n(13)},mediaIconCircle:{width:n(42),height:n(42),borderRadius:n(21),backgroundColor:"#E4E6EB",alignItems:"center",justifyContent:"center"},mediaRowText:{fontSize:n(15),color:"#050505",fontWeight:"600",flex:1},infoBackdrop:{flex:1,backgroundColor:"rgba(0,0,0,.45)",alignItems:"center",justifyContent:"center",padding:n(25)},infoCard:{width:"100%",maxWidth:n(330),backgroundColor:"#fff",borderRadius:n(18),padding:n(24),alignItems:"center"},infoTitle:{marginTop:n(12),fontSize:n(18),fontWeight:"700",color:"#050505",textAlign:"center"},infoText:{marginTop:n(8),fontSize:n(14),lineHeight:n(20),color:"#65676B",textAlign:"center"},infoButton:{marginTop:n(18),minWidth:n(90),height:n(42),borderRadius:n(10),backgroundColor:"#1877F2",alignItems:"center",justifyContent:"center"},infoButtonText:{color:"#fff",fontSize:n(15),fontWeight:"700"},'''
          if marker not in s:
              raise SystemExit('style marker missing')
          if 'mediaSheet:{backgroundColor' not in s:
              s = s.replace(marker, styles + marker, 1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/redom-frontend/src/screens/ProfileScreen.tsx
          git commit -m "Wire profile media into restored profile"
          git push
          git rm .github/workflows/wire-restored-profile-media.yml
          git commit -m "Remove temporary profile media wiring workflow"
          git push

name: ReDom SMS
on:
  push:
    paths:
      - "artifacts/redom-sms/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "artifacts/redom-sms/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  typecheck-sms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/redom-sms typecheck
      - run: pnpm --filter @workspace/redom-sms build

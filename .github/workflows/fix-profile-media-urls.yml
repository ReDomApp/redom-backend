name: Fix profile media delivery

on:
  workflow_dispatch:

jobs:
  fix-profile-media:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Route profile media through backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('artifacts/redom-backend/src/routes/profile.routes.ts')
          text = path.read_text()

          old = '''const mediaUrl = (key: string | null) =>
            key ? `${env.cloudflare.r2.bucketEndpoint.replace(/\\/$/, "")}/${key}` : null;'''
          new = '''const mediaUrl = (req: Request, key: string | null) => {
            if (!key) return null;
            if (/^https?:\\/\\//i.test(key)) return key;
            const forwardedProto = req.get("x-forwarded-proto")?.split(",")[0]?.trim();
            const protocol = forwardedProto || req.protocol;
            const host = req.get("host");
            if (!host) return key;
            const encodedKey = key.split("/").map(encodeURIComponent).join("/");
            return `${protocol}://${host}/profile/media/file/${encodedKey}`;
          };'''

          if old not in text:
              raise SystemExit('Expected mediaUrl definition was not found')
          text = text.replace(old, new, 1)
          text = re.sub(r'(?<!req, )mediaUrl\\(', 'mediaUrl(req, ', text)
          text = text.replace('import { env } from "../config/env";\\n', '')
          path.write_text(text)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/redom-backend/src/routes/profile.routes.ts
          git diff --cached --quiet || git commit -m "Route profile media through backend proxy"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-profile-media-urls.yml
          git commit -m "Remove temporary profile media fix workflow"
          git push

name: Daily operations intelligence CI

on:
  push:
    branches:
      - feat/daily-ops-intelligence
  pull_request:
    branches:
      - main
    paths:
      - "artifacts/redom-backend/**"
      - "docs/daily-ops-intelligence.md"
      - ".github/workflows/daily-ops-intelligence.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/redom-backend typecheck
      - run: pnpm --filter @workspace/redom-backend build

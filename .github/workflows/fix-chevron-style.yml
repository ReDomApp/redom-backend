name: Fix chevron style compatibility
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix accordion chevron rendering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fix accordion chevron rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/redom-frontend/src/screens/EditProfileScreen.tsx')
          s=p.read_text()
          old='<ChevronIcon width={16} height={16} style={open ? undefined : { transform: [{ rotate: "180deg" }] }} />'
          new='<View style={open ? styles.chevron : styles.chevronClosed}><ChevronIcon width={16} height={16} /></View>'
          if old not in s: raise SystemExit('chevron JSX marker not found')
          s=s.replace(old,new,1)
          marker='    sectionTitle: { fontSize: n(18), lineHeight: n(23), fontWeight: "700", color: "#050505" },'
          replacement=marker+'\n    chevron: { width: n(16), height: n(16), alignItems: "center", justifyContent: "center" },\n    chevronClosed: { width: n(16), height: n(16), alignItems: "center", justifyContent: "center", transform: [{ rotate: "180deg" }] },'
          if marker not in s: raise SystemExit('section style marker not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/redom-frontend/src/screens/EditProfileScreen.tsx
          git commit -m "Fix accordion chevron rendering"
          git push

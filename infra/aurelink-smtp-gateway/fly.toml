app = "aurelink-smtp-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HEALTH_PORT = "8080"
  ACME_HTTP_PORT = "8081"
  ACME_DATA_DIR = "/data"
  SMTP_HOSTNAME = "smtp.aurelink.org"
  SMTP_PORT_SSL = "465"
  SMTP_PORT_STARTTLS = "587"
  ACME_RETRY_INTERVAL_MS = "600000"
  ACME_RENEW_INTERVAL_MS = "43200000"

[deploy]
  strategy = "immediate"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

# Let's Encrypt HTTP-01 requires public port 80. The gateway serves only
# /.well-known/acme-challenge/* on internal port 8081.
[[services]]
  protocol = "tcp"
  internal_port = 8081
  auto_stop_machines = "off"
  auto_start_machines = false

  [[services.ports]]
    port = 80

# Customer SMTP: TLS terminates inside the gateway.
[[services]]
  protocol = "tcp"
  internal_port = 465
  auto_stop_machines = "off"
  auto_start_machines = false

  [[services.ports]]
    port = 465

[[services]]
  protocol = "tcp"
  internal_port = 587
  auto_stop_machines = "off"
  auto_start_machines = false

  [[services.ports]]
    port = 587

# Persistent Let's Encrypt account, certificates, renewal metadata and challenge files.
[mounts]
  source = "aurelink_smtp_data"
  destination = "/data"

# This health check remains healthy while the app waits for DNS/certificate issuance.
[checks.gateway_health]
  type = "http"
  port = 8080
  method = "get"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"

[[restart]]
  policy = "always"

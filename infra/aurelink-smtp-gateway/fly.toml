app = "aurelink-smtp-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HEALTH_PORT = "8080"
  SMTP_PORT_SSL = "465"
  SMTP_PORT_STARTTLS = "587"

[deploy]
  strategy = "immediate"

# SMTP is a long-lived TCP service. Keep one Machine running; do not
# configure autostop/scale-to-zero because clients need a continuously
# reachable SMTP listener.
[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

# Raw TCP passthrough is intentional: TLS terminates inside the gateway,
# which presents the smtp.aurelink.org certificate on ports 465 and 587.
[[services]]
  protocol = "tcp"
  internal_port = 465
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 465

  [[services.tcp_checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "3s"

[[services]]
  protocol = "tcp"
  internal_port = 587
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 587

  [[services.tcp_checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "3s"

# Private Machine health check. This does not publish port 8080 publicly.
[checks.gateway_health]
  type = "http"
  port = 8080
  method = "get"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

app = "aurelink-smtp-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HEALTH_PORT = "8080"
  SMTP_PORT_SSL = "465"
  SMTP_PORT_STARTTLS = "587"

[deploy]
  strategy = "immediate"

# SMTP is a long-lived TCP service. Keep the listener available.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

# Raw TCP passthrough: TLS terminates inside the gateway.
[[services]]
  protocol = "tcp"
  internal_port = 465
  auto_stop_machines = "off"
  auto_start_machines = false

  [[services.ports]]
    port = 465

  [[services.tcp_checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "3s"

[[services]]
  protocol = "tcp"
  internal_port = 587
  auto_stop_machines = "off"
  auto_start_machines = false

  [[services.ports]]
    port = 587

  [[services.tcp_checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "3s"

# Internal health check only; port 8080 is not publicly exposed.
[checks.gateway_health]
  type = "http"
  port = 8080
  method = "get"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"

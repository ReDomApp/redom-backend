services:
  - type: web
    runtime: static
    name: redom-web
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/redomweb run build
    staticPublishPath: artifacts/redomweb/dist
    pullRequestPreviewsEnabled: false
    previews:
      generation: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

services:
  - type: web
    runtime: static
    name: redom-web
    rootDir: artifacts/redomweb
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @workspace/redomweb run typecheck && pnpm --filter @workspace/redomweb run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    previews:
      generation: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1877f2" />
    <meta name="description" content="ReDom — connect, share, and discover." />
    <meta name="application-name" content="ReDom" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>ReDom</title>
    <style>
      html,body,#root{margin:0;min-height:100%;width:100%}
      body{min-width:320px;background:#f5f7fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .html-boot{min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#101828}
      .html-boot-card{text-align:center;padding:32px}
      .html-boot-logo{width:58px;height:58px;margin:0 auto 16px;display:block}
      .html-boot-name{font-size:25px;font-weight:800;letter-spacing:-.04em}
      .html-boot-status{display:block;margin-top:8px;color:#667085;font-size:14px}
      .html-boot-spinner{width:24px;height:24px;border:3px solid #dbe7fb;border-top-color:#1877f2;border-radius:50%;margin:20px auto 0;animation:html-spin .8s linear infinite}
      .html-boot-error{display:none;max-width:340px;margin:20px auto 0;color:#b42318;font-size:13px;line-height:19px}
      @keyframes html-spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="html-boot" aria-live="polite">
        <div class="html-boot-card">
          <img class="html-boot-logo" src="/logo.svg" alt="ReDom" />
          <div class="html-boot-name">ReDom</div>
          <span class="html-boot-status" id="boot-status">Starting ReDom…</span>
          <div class="html-boot-spinner" aria-hidden="true"></div>
          <div class="html-boot-error" id="boot-error"></div>
        </div>
      </div>
    </div>
    <script>
      window.__REDOM_BOOT_STARTED__=Date.now();
      window.addEventListener("error",function(e){
        var el=document.getElementById("boot-error");
        if(el){el.style.display="block";el.textContent="ReDom could not load the current web application. "+(e.message||"Please refresh and try again.");}
      });
      window.addEventListener("unhandledrejection",function(e){
        var el=document.getElementById("boot-error");
        if(el){el.style.display="block";el.textContent="ReDom could not start the current web application. Please refresh and try again.";}
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReDom Documentation</title><meta name="description" content="Official ReDom documentation, policies, payments, privacy and security information."><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#fff}.app{min-height:100vh}header{height:68px;border-bottom:1px solid #e7eaf0;display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;background:#fff;z-index:2}.brand{font-weight:800;color:#1877f2;text-decoration:none;font-size:20px}.brand span{color:#697386;font-weight:500;font-size:15px;margin-left:8px}nav{display:flex;gap:24px}a{color:#1877f2;text-decoration:none}main{max-width:1120px;margin:auto;padding:72px 6%}.hero{max-width:760px;margin-bottom:42px}.eyebrow{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#1877f2}.hero h1,article h1{font-size:48px;line-height:1.08;margin:12px 0 18px}.lead{font-size:21px;line-height:1.55;color:#5c667a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{display:block;border:1px solid #e4e8ef;border-radius:16px;padding:24px;transition:.15s}.card:hover{border-color:#1877f2}.card h2{font-size:18px;margin:0 0 10px;color:#172033}.card p{color:#697386;line-height:1.5;margin:0}article{max-width:780px}article h2{margin-top:40px;font-size:24px}article p{font-size:17px;line-height:1.75;color:#4e596b}footer{border-top:1px solid #e7eaf0;padding:28px 6%;color:#7a8496}@media(max-width:800px){nav{display:none}.grid{grid-template-columns:1fr}.hero h1,article h1{font-size:38px}main{padding-top:48px}}</style></head><body><div class="app"><header><a class="brand" href="/">ReDom <span>Documentation</span></a><nav><a href="/policies/payments">Payments</a><a href="/policies/security">Security</a><a href="/policies/privacy">Privacy</a></nav></header><main id="app"></main><footer>© ReDom · Official documentation</footer></div><script>
const policies={terms:["Terms of Service","The rules governing use of ReDom and its services."],privacy:["Privacy Policy","How ReDom handles account, service and privacy information."],community:["Community Standards","Rules for respectful and safe participation on ReDom."],messaging:["Messaging Policy","Information about messaging and communication features."],media:["Media Policy","Rules and guidance for media shared through ReDom."],calls:["Calls Policy","Information about ReDom calling and communication features."],notifications:["Notifications Policy","How notifications work and how users can manage them."],security:["Security Policy","Security practices and guidance for protecting ReDom accounts."],verification:["Verification Policy","Information about identity, device and account verification."],ai:["AI Policy","Information about AI-powered features and responsible use."],regional:["Regional Policy","Regional availability and service considerations."],refunds:["Refund Policy","The rules and process for eligible ReDom refunds."],support:["Support Policy","How ReDom support requests and support links work."],"link-history":["Link History Policy","How validated support and documentation links are handled."],payments:["Payment Policy","Information about ReDom payments, transactions and payment services."]};
const key=location.pathname.match(/^\/policies\/([^/]+)\/?$/)?.[1],data=policies[key];const el=document.getElementById("app");if(data){el.innerHTML='<article><p class="eyebrow">ReDom Policy</p><h1>'+data[0]+'</h1><p class="lead">'+data[1]+'</p><p>This page is part of the official ReDom documentation. The published policy text should be maintained by ReDom and updated when the applicable service, law, or policy changes.</p><h2>Overview</h2><p>ReDom provides this documentation so users can understand applicable rules, service behavior, account responsibilities and available support options.</p><h2>Questions and support</h2><p>For assistance with this topic, visit the <a href="https://help.wnncompany.com">ReDom Help Center</a>.</p></article>'}else{el.innerHTML='<section class="hero"><p class="eyebrow">Official documentation</p><h1>ReDom Documentation</h1><p class="lead">Policies, payments, privacy, security and product information for ReDom.</p></section><section class="grid">'+Object.entries(policies).map(([k,v])=>'<a class="card" href="/policies/'+k+'"><h2>'+v[0]+'</h2><p>'+v[1]+'</p></a>').join("")+'</section>'}
</script></body></html>

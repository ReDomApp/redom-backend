<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReDom Help Center</title><meta name="description" content="Official ReDom Help Center for accounts, payments, security, refunds and messaging."><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f7f9fc}.app{min-height:100vh}header{height:68px;border-bottom:1px solid #e2e7ef;display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:#fff}.brand{font-weight:800;color:#1877f2;text-decoration:none;font-size:20px}.brand span{color:#697386;font-weight:500;font-size:15px;margin-left:8px}.docs{color:#1877f2;text-decoration:none}main{max-width:1120px;margin:auto;padding:64px 6%}.hero{text-align:center;max-width:760px;margin:0 auto 48px}.eyebrow{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#1877f2}.hero h1,article h1{font-size:48px;line-height:1.08;margin:12px 0 18px}.lead{font-size:20px;line-height:1.55;color:#626d80}.search{background:#fff;border:1px solid #dfe4ec;border-radius:12px;text-align:left;padding:17px 20px;color:#8a93a2;margin-top:28px;box-shadow:0 4px 18px #15233d0b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:16px;padding:24px;text-decoration:none;color:#172033;min-height:190px}.card:hover{border-color:#1877f2}.icon{width:36px;height:36px;border-radius:10px;background:#eaf3ff;color:#1877f2;display:grid;place-items:center;font-weight:800}.card h2{font-size:19px;margin:18px 0 8px}.card p,article p{color:#626d80;line-height:1.65}article{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:42px;max-width:800px;margin:auto}article a{color:#1877f2;text-decoration:none}article h2{margin-top:34px}footer{padding:28px 6%;background:#fff;border-top:1px solid #e1e6ee;color:#7a8496}footer a{color:#1877f2;text-decoration:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero h1,article h1{font-size:38px}main{padding-top:44px}}</style></head><body><div class="app"><header><a class="brand" href="/">ReDom <span>Help Center</span></a><a class="docs" href="https://docs.wnncompany.com">Documentation</a></header><main id="app"></main><footer>© ReDom · Help Center · <a href="https://docs.wnncompany.com/policies/privacy">Privacy</a> · <a href="https://docs.wnncompany.com/policies/terms">Terms</a></footer></div><script>
const articles={payments:["Payments","Learn about ReDom payments, transaction statuses, payment methods and billing."],refunds:["Refunds","Learn about refund eligibility, requests, verification and refund status."],account:["Account","Get help with account access, profile settings and account-related questions."],security:["Security","Protect your account, understand security controls and respond to suspicious activity."],verification:["Verification","Learn about account, device and identity verification."],messaging:["Messaging","Get help with messages, conversations and communication features."],marketplace:["Marketplace","Learn about buying, selling and marketplace features on ReDom."]};
const path=location.pathname.replace(/^\/+|\/+$/g,""),key=path==="payments/refunds"?"refunds":path,data=articles[key];const el=document.getElementById("app");if(data){el.innerHTML='<article><a href="/">← Back to Help Center</a><p class="eyebrow">Help article</p><h1>'+data[0]+'</h1><p class="lead">'+data[1]+'</p><h2>Getting started</h2><p>This help section provides official guidance for ReDom users. Specific steps may vary by account status, region, product availability and the current version of ReDom.</p><h2>Still need help?</h2><p>Contact ReDom Support through the app or your authenticated support channel. Never share passwords, card security codes or authentication codes with anyone.</p></article>'}else{el.innerHTML='<section class="hero"><p class="eyebrow">ReDom Help Center</p><h1>How can we help?</h1><p class="lead">Find guidance for your account, payments, security, verification and ReDom features.</p><div class="search">Search ReDom Help <span style="float:right">⌕</span></div></section><section class="grid">'+Object.entries(articles).map(([k,v])=>'<a class="card" href="'+(k==="refunds"?"/payments/refunds":"/"+k)+'"><div class="icon">R</div><h2>'+v[0]+'</h2><p>'+v[1]+'</p></a>').join("")+'</section>'}
</script></body></html>

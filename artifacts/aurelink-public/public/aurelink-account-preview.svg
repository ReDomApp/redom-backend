<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Aurelink account screens</title><desc id="desc">Visual reference of Aurelink sign-in, account creation, and account completion screens.</desc><rect width="900" height="430" rx="24" fill="#eef4fb"/><rect x="30" y="26" width="840" height="70" rx="14" fill="#173b78"/><text x="58" y="68" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff" letter-spacing="3">AURELINK</text><text x="842" y="67" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#dceaff">ACCOUNT SECURITY</text><g font-family="Arial,sans-serif"><rect x="30" y="120" width="260" height="275" rx="14" fill="#fff" stroke="#d4deea" stroke-width="2"/><text x="52" y="154" font-size="17" font-weight="700" fill="#173b78">SIGN IN</text><rect x="52" y="174" width="216" height="39" rx="5" fill="#fff" stroke="#c6d2e1"/><text x="66" y="199" font-size="14" fill="#7b8798">Email address</text><rect x="52" y="225" width="216" height="39" rx="5" fill="#fff" stroke="#c6d2e1"/><text x="66" y="250" font-size="14" fill="#7b8798">Password</text><rect x="52" y="281" width="216" height="43" rx="5" fill="#087be5"/><text x="160" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Sign in securely</text><text x="160" y="355" text-anchor="middle" font-size="13" fill="#5c6e84">Password recovery</text><text x="160" y="376" text-anchor="middle" font-size="13" fill="#5c6e84">Create an account</text><rect x="320" y="120" width="260" height="275" rx="14" fill="#fff" stroke="#d4deea" stroke-width="2"/><text x="342" y="154" font-size="17" font-weight="700" fill="#173b78">CREATE ACCOUNT</text><rect x="342" y="174" width="216" height="39" rx="5" fill="#fff" stroke="#c6d2e1"/><text x="356" y="199" font-size="14" fill="#7b8798">Full name</text><rect x="342" y="225" width="216" height="39" rx="5" fill="#fff" stroke="#c6d2e1"/><text x="356" y="250" font-size="14" fill="#7b8798">Email confirmed</text><rect x="342" y="281" width="216" height="43" rx="5" fill="#087be5"/><text x="450" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Create account</text><text x="450" y="355" text-anchor="middle" font-size="13" fill="#5c6e84">Secure database update</text><text x="450" y="376" text-anchor="middle" font-size="13" fill="#5c6e84">Unique Account ID</text><rect x="610" y="120" width="260" height="275" rx="14" fill="#fff" stroke="#d4deea" stroke-width="2"/><text x="632" y="154" font-size="17" font-weight="700" fill="#173b78">ACCOUNT READY</text><circle cx="740" cy="225" r="49" fill="#e9f8ef" stroke="#16834b" stroke-width="4"/><path d="M714 225l18 18 35-39" fill="none" stroke="#16834b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="740" y="302" text-anchor="middle" font-size="17" font-weight="700" fill="#173b78">Account created</text><text x="740" y="329" text-anchor="middle" font-size="13" fill="#5c6e84">Open a fresh screen</text><text x="740" y="350" text-anchor="middle" font-size="13" fill="#5c6e84">and sign in</text></g></svg>
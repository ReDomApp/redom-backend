<script>
const BASE=(document.querySelector('meta[name="aurelink-api-base"]')?.content||"https://redom-backend.onrender.com/redom-backend").replace(/\/$/,"");
const TOKEN=sessionStorage.getItem("aurelink.accessToken");
const USER=(()=>{try{return JSON.parse(sessionStorage.getItem("aurelink.user")||"{}")}catch{return {}}})();
let page="overview",wid=sessionStorage.getItem("aurelink.workspaceId")||"",domainRows=[],emailSenders=[],smsSenders=[],records={};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function dt(v){if(!v)return "—";let d=new Date(v);return isNaN(d)? "—":d.toLocaleString();}
function money(v,c="USD"){return new Intl.NumberFormat(undefined,{style:"currency",currency:c}).format(Number(v||0)/100);}
function badge(v){let s=String(v||"unknown").toLowerCase(),k=["delivered","verified","active","approved","completed","success"].includes(s)?"green":["failed","rejected","revoked","suspended","bounced"].includes(s)?"red":["pending","queued","processing","draft","review","verification_pending"].includes(s)?"amber":"blue";return '<span class="badge '+k+'">'+esc(s.replaceAll("_"," "))+"</span>";}
function loading(on,title,copy){$("#loader").classList.toggle("on",on);$("#loadtitle").textContent=title||"Loading workspace";$("#loadcopy").textContent=copy||"Connecting securely to Aurelink";}
function notice(t,k){return '<div class="notice show '+(k||"info")+'">'+esc(t)+"</div>";}
function say(el,t,k){el.className="notice show "+k;el.textContent=t;}
function headers(extra){return Object.assign({"Accept":"application/json","Authorization":"Bearer "+TOKEN},wid?{"X-Aurelink-Workspace-Id":wid}:{},extra||{});}
async function api(path,opt){opt=opt||{};let url=BASE+path;if(opt.query){let q=new URLSearchParams();Object.keys(opt.query).forEach(k=>{let v=opt.query[k];if(v!==undefined&&v!==null&&v!=="")q.set(k,String(v));});if(q.size)url+="?"+q.toString();}let h=headers(Object.assign(opt.body!==undefined?{"Content-Type":"application/json"}:{},opt.idem?{"Idempotency-Key":opt.idem}:{},opt.headers||{}));let res;try{res=await fetch(url,{method:opt.method||"GET",headers:h,body:opt.body===undefined?undefined:JSON.stringify(opt.body),credentials:"omit",cache:"no-store"});}catch{throw Error("Aurelink could not be reached. Check your connection and retry.");}let d={};try{d=await res.json()}catch{}if(!res.ok||d.success===false){if(res.status===401){sessionStorage.removeItem("aurelink.accessToken");location.replace("index.html?screen=login&next=/dashboard.html");}throw Error(d.message||"Request failed ("+res.status+").");}if(d.workspaceId&&!wid){wid=d.workspaceId;sessionStorage.setItem("aurelink.workspaceId",wid);}return d;}
function head(t,p,action){return '<div class="head"><div><div class="eyebrow">Aurelink workspace</div><h1>'+t+'</h1><p>'+p+'</p></div>'+(action||"")+"</div>";}
function card(t,body,sub){return '<section class="card"><div class="cardhead"><b>'+t+'</b>'+(sub?'<span class="hint">'+sub+"</span>":"")+'</div>'+body+"</section>";}
function table(h,rows,empty){return '<div class="tablewrap"><table><thead><tr>'+h.map(x=>"<th>"+x+"</th>").join("")+'</tr></thead><tbody>'+(rows||'<tr><td colspan="'+h.length+'"><div class="empty">'+(empty||"No records yet.")+"</div></td></tr>")+"</tbody></table></div>";}
function field(label,id,ph,type,full){return '<div class="field '+(full?"full":"")+'"><label for="'+id+'">'+label+"</label>"+(type==="textarea"?'<textarea id="'+id+'" placeholder="'+(ph||"")+'"></textarea>':type==="select"?'<select id="'+id+'">'+(ph||"")+"</select>":'<input id="'+id+'" type="'+(type||"text")+'" placeholder="'+(ph||"")+'">')+"</div>";}
function stat(t,v,n){return '<div class="stat"><span>'+t+'</span><strong>'+v+'</strong><small>'+(n||"Last 30 days")+"</small></div>";}
function btn(t,a,primary){return '<button class="btn '+(primary?"primary":"")+'" data-act="'+a+'">'+t+"</button>";}
function modal(t,b){$("#modaltitle").textContent=t;$("#modalbody").innerHTML=b;$("#modal").classList.add("on");}
function closeModal(){$("#modal").classList.remove("on");}
async function overview(){
 let d=await api("/aurelink/communications/overview");records.overview=d;
 let m=d.messages||[],sum=c=>m.filter(x=>x.channel===c).reduce((a,x)=>a+Number(x.total||0),0),total=m.reduce((a,x)=>a+Number(x.total||0),0);
 let statuses=["accepted","delivered","failed","pending","queued"],countStatus=z=>m.filter(x=>x.status===z).reduce((a,x)=>a+Number(x.total||0),0);
 let recent=await api("/aurelink/communications/messages",{query:{limit:8}}).catch(()=>({messages:[]}));
 let rows=(recent.messages||[]).map(x=>"<tr><td>"+esc(x.recipient||"—")+"</td><td>"+esc(x.channel)+"</td><td>"+badge(x.status)+"</td><td>"+esc(x.provider||"—")+"</td><td>"+dt(x.created_at)+"</td></tr>").join("");
 let p=d.providers||{},usageRows=(d.usage||[]).map(x=>"<tr><td>"+esc(x.channel)+"</td><td>"+esc(x.status)+"</td><td>"+Number(x.messages||0).toLocaleString()+"</td><td>"+Number(x.units||0).toLocaleString()+"</td><td>"+money(x.metered_amount_minor,x.currency||"USD")+"</td></tr>").join("");
 let statusCards='<div class="stats">'+statuses.map(z=>stat(z.charAt(0).toUpperCase()+z.slice(1),countStatus(z).toLocaleString(),"Message records")).join("")+"</div>";
 $("#workspace").innerHTML=head("Your communications, in one place","A unified view of phone services, SMS, Email and developer activity.",btn("Send SMS","goto-sms",true))+
 '<div class="stats">'+stat("Total messages",total.toLocaleString(),"SMS + Email")+stat("SMS messages",sum("sms").toLocaleString(),"Last 30 days")+stat("Email messages",sum("email").toLocaleString(),"Last 30 days")+stat("Contacts",Number(d.contacts?.sms||0)+Number(d.contacts?.email||0),"SMS and Email audiences")+"</div>"+
 '<div class="cols">'+card("Quick actions",'<div class="cardbody quick"><button data-page="sms-send"><b>Send SMS</b><small>Compose and queue a text message</small></button><button data-page="email-send"><b>Send email</b><small>Send through a verified sender</small></button><button data-page="domains"><b>Verify a domain</b><small>Configure authenticated sending</small></button><button data-page="developer"><b>Developer tools</b><small>Inspect API usage and logs</small></button></div>')+
 card("Provider configuration",'<div class="cardbody"><p>SMS · Brevo '+badge(p.sms?.brevo?"configured":"not configured")+'</p><p>SMS · Twilio '+badge(p.sms?.twilio?"configured":"not configured")+'</p><p>Email · Resend '+badge(p.email?.resend?"configured":"not configured")+'</p><p>Email · Brevo '+badge(p.email?.brevo?"configured":"not configured")+"</p></div>")+"</div>"+
 card("Message status breakdown",'<div class="cardbody">'+statusCards+"</div>","Aggregated across SMS and Email")+
 card("Communications usage",table(["Channel","Status","Messages","Units","Metered amount"],usageRows,"No metered usage has been recorded yet."),"Usage rows returned by the communications ledger")+
 card("Recent message activity",table(["Recipient","Channel","Status","Provider","Created"],rows,"No messages have been recorded yet."),"Latest SMS and Email records");
}
async function phone(){let w=await api("/aurelink/wallet").catch(e=>({error:e.message})),o=await api("/aurelink/orders").catch(()=>({orders:[]})),x=w.wallet||w,rows=(o.orders||[]).map(a=>"<tr><td>"+esc(a.id)+"</td><td>"+esc(a.phone_number||a.phoneNumber||"—")+"</td><td>"+esc(a.service||"—")+"</td><td>"+badge(a.status)+"</td><td>"+dt(a.created_at)+"</td></tr>").join("");$("#workspace").innerHTML=head("Phone numbers","Existing number products remain separate. This page reads your number wallet and order history without changing the current SMSPool, NonVoip, purchasing, renewal or internal settings flows.")+'<div class="stats">'+stat("Number wallet",esc(x.balanceUsd||money(x.balance_minor)),"Existing number-product wallet")+stat("Orders",(o.orders||[]).length,"Recorded number orders")+stat("Short-term","SMSPool","Existing provider")+stat("Long-term & Dedicated","NonVoip","Existing provider")+"</div>"+card("Number order history",table(["Order","Number","Service","Status","Created"],rows,"No number orders returned."))+'<div class="bar">Phone-number purchase, pricing, activation, rental, dedicated-number and renewal workflows are intentionally left unchanged.</div>';}
async function smsSend(){let [c,s]=await Promise.all([api("/aurelink/communications/sms/countries").catch(()=>({countries:[]})),api("/aurelink/communications/senders").catch(()=>({senders:[]}))]);smsSenders=s.senders||[];let cs=(c.countries||[]).map(x=>'<option value="'+esc(x.country_code||x.code)+'">'+esc(x.country_name||x.name)+" ("+esc(x.calling_code||"")+")</option>").join(""),ss=smsSenders.map(x=>'<option value="'+esc(x.sender)+'">'+esc(x.sender)+" · "+esc(x.status)+"</option>").join("");$("#workspace").innerHTML=head("Send SMS","Aurelink validates E.164 destination, supported country, sender approval, consent and idempotency before queueing.")+card("New SMS message",'<div class="cardbody"><form id="sms" class="formgrid">'+field("Recipient (E.164)","recipient","+14155550123")+field("Destination country","country",cs,"select")+field("Approved sender identity","sender",ss,"select")+field("Message category","category",'<option value="transactional">Transactional</option><option value="notification">Notification</option><option value="otp">OTP</option><option value="marketing">Marketing</option>',"select")+field("Message content","content","Write your message","textarea",true)+'<div class="field full hint">Provider selection is resolved by the backend workspace configuration for this route; this UI does not claim to override it.</div><div class="field full"><div class="notice" id="smsnote"></div></div><div class="actions"><button class="btn primary">Queue SMS</button></div></form></div>');$("#sms").addEventListener("submit",async e=>{e.preventDefault();let body={recipient:$("#recipient").value.trim(),countryCode:$("#country").value,sender:$("#sender").value,category:$("#category").value,content:$("#content").value};try{loading(true,"Queueing SMS","Checking sender, country and billing reservation");let d=await api("/aurelink/communications/sms/send",{method:"POST",body:body,idem:crypto.randomUUID()});loading(false);say($("#smsnote"),d.message||"Message accepted into async function smsActivity(){let d=await api("/aurelink/communications/messages",{query:{channel:"sms",limit:100}});records.sms=d.messages||[];let rows=records.sms.map(x=>"<tr><td>"+esc(x.id)+"</td><td>"+esc(x.recipient||"—")+"</td><td>"+badge(x.status)+"</td><td>"+esc(x.provider||"—")+"</td><td>"+dt(x.created_at)+"</td><td>"+(["failed","rejected"].includes(x.status)?'<button class="btn" data-retry="'+esc(x.id)+'">Retry</button>':"—")+"</td></tr>").join("");$("#workspace").innerHTML=head("SMS activity","Search message history and retry only backend-eligible failed messages.")+card("SMS message records",'<div class="cardbody"><input id="filter" placeholder="Search recipient or message ID" style="padding:9px;border:1px solid #dce3ed;border-radius:7px;width:min(320px,100%)"></div>'+table(["Message ID","Recipient","Status","Provider","Created","Action"],rows,"No SMS messages yet."));$("#filter").addEventListener("input",e=>{$$("#workspace tbody tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(e.target.value.toLowerCase())?"":"none")});$$("[data-retry]").forEach(b=>b.addEventListener("click",async()=>{try{loading(true,"Retrying message");await api("/aurelink/communications/messages/"+encodeURIComponent(b.dataset.retry)+"/retry",{method:"POST",body:{}});loading(false);smsActivity();}catch(err){loading(false);alert(err.message);}}));}

function newHook(){modal("Create webhook",'<form id="whf" class="formgrid">'+field("HTTPS endpoint URL","whurl","https://example.com/webhooks/aurelink","url",true)+field("Description","whdesc","Production receiver")+field("Environment","when",'<option value="live">Live</option><option value="test">Test</option>',"select")+field("Events, comma separated","whevents","message.delivered, message.failed","text",true)+'<div class="field full"><div class="notice" id="whnote"></div></div><div class="actions"><button class="btn primary">Create endpoint</button></div></form>');$("#whf").addEventListener("submit",async e=>{e.preventDefault();try{let x=await api("/aurelink/developer/webhooks",{method:"POST",body:{url:$("#whurl").value,description:$("#whdesc").value,environment:$("#when").value,events:$("#whevents").value.split(",").map(x=>x.trim()).filter(Boolean)}});closeModal();modal("Webhook secret — shown once",'<div class="bar">Store this signing secret securely. Verify signatures before processing incoming events.</div><p class="mono">'+esc(x.secret)+"</p>");webhooks();}catch(err){say($("#whnote"),err.message,"error");}});}
async function billing(){let [b,p,pk,m]=await Promise.all([api("/aurelink/communications/billing/overview"),api("/aurelink/communications/email/billing/plans"),api("/aurelink/communications/email/billing/credit-packs"),api("/aurelink/communications/email/billing/overview").catch(e=>({error:e.message}))]),u=(b.usage||[]).map(x=>"<tr><td>"+esc(x.channel)+"</td><td>"+esc(x.status)+"</td><td>"+esc(x.messages)+"</td><td>"+esc(x.units)+"</td></tr>").join(""),plans=(p.plans||[]).map(x=>"<tr><td>"+esc(x.display_name)+"</td><td>"+esc(x.min_monthly_emails)+"–"+esc(x.max_monthly_emails)+"</td><td>"+(x.options||[]).map(y=>money(y.monthlyPriceMinor)).join(" / ")+"</td></tr>").join(""),packs=(pk.creditPacks||[]).map(x=>"<tr><td>"+Number(x.email_credits).toLocaleString()+"</td><td>"+money(x.price_minor,x.currency||"USD")+"</td></tr>").join("");$("#workspace").innerHTML=head("Billing & usage","Number wallet, SMS prepaid segments and Mail credits remain separate. No generic shared balance is shown.")+'<div class="stats">'+stat("Communications wallet",money(b.wallet?.balanceMinor,b.wallet?.currency))+stat("30-day charges",money(b.ledger?.charged_minor))+stat("30-day refunds",money(b.ledger?.refunded_minor))+stat("Mail credits",Number(m.credits?.available_credits||0).toLocaleString(),"Email-only credits")+"</div>"+card("Communications usage",table(["Channel","Status","Messages","Units"],u,"No usage yet."))+card("Mail monthly plans",table(["Plan","Monthly allowance","Active price options"],plans,"No plan catalogue."))+card("Prepaid Mail packs",table(["Credits","Price"],packs,"No active packs."));}

function invite(){modal("Invite a member",'<form id="if" class="formgrid">'+field("Email","ie","colleague@example.com","email")+field("Role","ir",'<option value="developer">Developer</option><option value="analyst">Analyst</option><option value="billing">Billing</option><option value="admin">Admin</option>',"select")+'<div class="field full hint">The API returns a one-time invitation token for secure delivery to the invited email.</div><div class="field full"><div class="notice" id="inote"></div></div><div class="actions"><button class="btn primary">Create invitation</button></div></form>');$("#if").addEventListener("submit",async e=>{e.preventDefault();try{let x=await api("/aurelink/communications/team/invitations",{method:"POST",body:{email:$("#ie").value,role:$("#ir").value}});closeModal();modal("Invitation token",'<div class="bar">Send this token to '+esc(x.invitation?.email)+". Expires "+dt(x.expiresAt)+".</div><p class=\"mono\">"+esc(x.invitationToken)+"</p>");team();}catch(err){say($("#inote"),err.message,"error");}});}
async function otp(){
 let pair=await Promise.all([api("/aurelink/communications/email-senders").catch(()=>({senders:[]})),api("/aurelink/communications/senders").catch(()=>({senders:[]}))]);
 emailSenders=pair[0].senders||[];smsSenders=pair[1].senders||[];
 let emailOpts=emailSenders.filter(x=>x.status==="verified"||x.status==="active").map(x=>'<option value="'+esc(x.email)+'">'+esc(x.email)+" · "+esc(x.status)+"</option>").join("");
 let smsOpts=smsSenders.filter(x=>x.status==="approved").map(x=>'<option value="'+esc(x.sender)+'">'+esc(x.sender)+" · "+esc(x.status)+"</option>").join("");
 $("#workspace").innerHTML=head("OTP verification","Aurelink generates and validates each code. The SMS or email provider only delivers it. Lifetime: five minutes; maximum five attempts.")+
 '<div class="bar">Live OTP codes are never returned by the API. SMS verification requires an approved Sender ID; email verification requires a verified email sender.</div>'+
 card("Start verification",'<div class="cardbody"><form id="otpf" class="formgrid">'+field("Channel","oc",'<option value="email">Email</option><option value="sms">SMS</option>',"select")+field("Destination","od","name@example.com")+field("Purpose","op","account")+field("Sender identity","os",emailOpts,"select")+field("SMS country ISO","occ","US")+'<div class="field full"><div class="notice" id="onote"></div></div><div class="actions"><button class="btn primary">Send verification code</button></div></form><div id="otpcheck"></div></div>');
 $("#oc").addEventListener("change",()=>{$("#os").innerHTML=$("#oc").value==="sms"?smsOpts:emailOpts;});
 $("#otpf").addEventListener("submit",async e=>{e.preventDefault();try{let x=await api("/aurelink/verify/start",{method:"POST",body:{channel:$("#oc").value,destination:$("#od").value,purpose:$("#op").value,sender:$("#os").value,countryCode:$("#occ").value.toUpperCase()}});$("#otpcheck").innerHTML='<form id="checkf" class="formgrid">'+field("Verification code","code","Enter code")+'<div class="actions"><button class="btn primary">Verify code</button></div><div class="field full"><div class="notice" id="checknote"></div></div></form>';$("#checkf").addEventListener("submit",async ev=>{ev.preventDefault();try{let z=await api("/aurelink/verify/"+x.verificationId+"/check",{method:"POST",body:{code:$("#code").value}});say($("#checknote"),z.verified?"Verification successful.":"Code was not accepted.",z.verified?"success":"error");}catch(err){say($("#checknote"),err.message,"error");}});}catch(err){say($("#onote"),err.message,"error");}});
}

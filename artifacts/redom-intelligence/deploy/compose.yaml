services:
  intelligence-api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8088"
      SERVICE_API_KEYS: ${SERVICE_API_KEYS:?Set a long random service key}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      MAX_CONCURRENT_INFERENCE: ${MAX_CONCURRENT_INFERENCE:-8}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      AUREX_18_BASE_URL: http://aurex-18-vllm:8000
      AUREX_18_API_KEY: ${AUREX_18_API_KEY:?Set a separate AUREX 1.8 inference key}
      AUREX_18_MODEL: ${AUREX_18_MODEL:-aurex-1.8}
      AUREX_18_TIMEOUT_MS: ${AUREX_18_TIMEOUT_MS:-90000}
      REX_68_BASE_URL: http://rex-68-vllm:8000
      REX_68_API_KEY: ${REX_68_API_KEY:-}
      REX_68_MODEL: ${REX_68_MODEL:-}
      REX_68_TIMEOUT_MS: ${REX_68_TIMEOUT_MS:-120000}
      AUREX_APEX_BASE_URL: http://aurex-apex-vllm:8000
      AUREX_APEX_API_KEY: ${AUREX_APEX_API_KEY:-}
      AUREX_APEX_MODEL: ${AUREX_APEX_MODEL:-}
      AUREX_APEX_TIMEOUT_MS: ${AUREX_APEX_TIMEOUT_MS:-120000}
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      aurex-18-vllm:
        condition: service_started
    networks:
      - intelligence-private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  aurex-18-vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command:
      - --model
      - ${AUREX_18_MODEL_ID:-Qwen/Qwen3-8B}
      - --served-model-name
      - ${AUREX_18_MODEL:-aurex-1.8}
      - --api-key
      - ${AUREX_18_API_KEY:?Set a separate AUREX 1.8 inference key}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /model-cache
    volumes:
      - aurex-18-model-cache:/model-cache
    expose:
      - "8000"
    networks:
      - intelligence-private
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  rex-68-vllm:
    image: vllm/vllm-openai:latest
    profiles: ["rex-68"]
    restart: unless-stopped
    command:
      - --model
      - ${REX_68_MODEL_ID:-Qwen/Qwen2.5-Coder-7B-Instruct}
      - --served-model-name
      - ${REX_68_MODEL:-rex-6.8}
      - --api-key
      - ${REX_68_API_KEY:-configure-a-long-random-rex-secret}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /model-cache
    volumes:
      - rex-68-model-cache:/model-cache
    expose:
      - "8000"
    networks:
      - intelligence-private
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  aurex-apex-vllm:
    image: vllm/vllm-openai:latest
    profiles: ["aurex-apex"]
    restart: unless-stopped
    command:
      - --model
      - ${AUREX_APEX_MODEL_ID:-Qwen/Qwen3-14B}
      - --served-model-name
      - ${AUREX_APEX_MODEL:-aurex-apex}
      - --api-key
      - ${AUREX_APEX_API_KEY:-configure-a-long-random-apex-secret}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /model-cache
    volumes:
      - aurex-apex-model-cache:/model-cache
    expose:
      - "8000"
    networks:
      - intelligence-private
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
networks:
  intelligence-private:
    driver: bridge
volumes:
  aurex-18-model-cache:
  rex-68-model-cache:
  aurex-apex-model-cache:

services:
  intelligence-api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8088"
      SERVICE_API_KEYS: ${SERVICE_API_KEYS:?Set a long random service key}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      AUREX_18_BASE_URL: http://vllm:8000
      AUREX_18_API_KEY: ${AUREX_18_API_KEY:?Set a separate inference key}
      AUREX_18_MODEL: ${AUREX_18_MODEL:-aurex-1.8}
      AUREX_18_TIMEOUT_MS: ${AUREX_18_TIMEOUT_MS:-90000}
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      vllm:
        condition: service_started
    networks:
      - intelligence-private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command:
      - --model
      - ${MODEL_ID:-Qwen/Qwen3-8B}
      - --served-model-name
      - ${AUREX_18_MODEL:-aurex-1.8}
      - --api-key
      - ${AUREX_18_API_KEY:?Set a separate inference key}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /model-cache
    volumes:
      - model-cache:/model-cache
    expose:
      - "8000"
    networks:
      - intelligence-private
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
networks:
  intelligence-private:
    driver: bridge
volumes:
  model-cache:

services:
  fbi-security:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /srv/fbi-security/data/fbi_security.sqlite3
      APP_ENV: production
    volumes:
      - fbi_security_data:/srv/fbi-security/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  fbi_security_data:
